name: Docs site

# Builds docs-site/ with this repo's Cook (cook-ssg is a file:.. dependency)
# and deploys it to GitHub Pages at https://profpowell.github.io/cook/
on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - 'scripts/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json
      - name: Install Cook
        run: npm ci
      - name: Install docs site
        run: npm ci
        working-directory: docs-site
      - name: Build docs site
        run: npm run build
        working-directory: docs-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
