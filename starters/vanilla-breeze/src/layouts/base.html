<!doctype html>
<html lang="en">
<head>
  <script type="application/json" data-layout-info>
  { "format": 1, "label": "Base", "description": "The document shell every layout builds on.",
    "abstract": true,
    "slots": { "nav": { "label": "Section menu" }, "aside": { "label": "Sidebar" }, "head": { "label": "Head" } } }
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title} · ${siteTitle}</title>
  <meta name="description" content="${description}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/vendor/vanilla-breeze/vanilla-breeze.css">
  <script src="/assets/vendor/vanilla-breeze/vanilla-breeze.js" type="module"></script>
  ${slot:head}
</head>
<body data-page-layout="${pageLayout}">
  <div data-include="/includes/header.html"></div>
  <nav data-if="slot:nav" aria-label="Section menu">${slot:nav}</nav>
  <main id="main">${content}</main>
  <aside data-if="slot:aside" aria-label="Sidebar">${slot:aside}</aside>
  <div data-include="/includes/footer.html"></div>
</body>
</html>
